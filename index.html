<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Zapisy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zapisy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f7f9;--card:#fff;--tx:#1f2f3a;--mu:#5b6f7c;--ac:#4a6b80;--bd:#d5dfe5;--chip:#e4edf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b20;--card:#1c262d;--tx:#e6eef2;--mu:#98aab5;--ac:#8fb4c9;--bd:#2e3c45;--chip:#27353e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:1.25rem;margin:6px 0 2px;font-weight:600}
.sub{color:var(--mu);font-size:.85rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 12px}
label{display:block;font-weight:600;font-size:.92rem;color:var(--ac);margin:0 0 2px}
.h{font-size:.8rem;color:var(--mu);margin:0 0 6px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{min-height:70px;resize:vertical}
.f{margin:0 0 14px}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--bg);font-weight:600}
button.s{background:var(--chip);color:var(--tx)}
button.d{background:transparent;color:#b3433b;padding:6px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.82rem}
.chip b{margin-left:6px;cursor:pointer}
.def{font-size:.85rem;color:var(--mu);background:var(--chip);border-radius:8px;padding:8px 10px;margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:200px}
.e{cursor:pointer}
.e .d1{font-size:.78rem;color:var(--mu)}
.e p{margin:4px 0 0}
dl{margin:0}dt{font-weight:600;color:var(--ac);font-size:.85rem;margin-top:10px}dd{margin:2px 0 0;white-space:pre-wrap}
.warn{font-size:.8rem;color:var(--mu)}
.card h2{font-size:1rem;margin:0 0 2px;font-weight:600}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}.seg button{flex:1;background:transparent;color:var(--mu);padding:8px 4px;border-radius:9px;font-weight:600}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}.tile b{display:block;font-size:1.6rem;line-height:1.15}.tile span{font-size:.72rem;color:var(--mu)}
.br{margin:0 0 12px}.bt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.88rem}.nm{display:flex;gap:8px;align-items:baseline;min-width:0}.rk{font-style:normal;font-size:.72rem;color:var(--mu);min-width:14px}.ct{white-space:nowrap}.ct small{color:var(--mu)}
.bg{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:4px}.bg i{display:block;height:100%;border-radius:6px}
.lg{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--mu);margin:2px 0 12px}.lg i{flex:1;height:6px;border-radius:4px;background:linear-gradient(90deg,hsl(175 55% 48%),hsl(100 55% 48%),hsl(25 55% 48%))}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:8px 0}.stk i{display:block;height:100%}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}.lgd span{display:flex;align-items:center;gap:6px}.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mr{width:100%;margin-top:4px;background:var(--chip);color:var(--tx)}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}.lk{width:100%;max-width:320px}.lk h1{text-align:center}.lk button{width:100%}
.bar button{padding:11px 4px;font-size:.88rem}
@page{size:A4;margin:14mm}
@media print{.bar,.noprint,#lock,.mr{display:none!important}:root:root:root{--bg:#fff;--card:#fff;--tx:#1f2f3a;--mu:#5b6f7c;--ac:#4a6b80;--bd:#d5dfe5;--chip:#e4edf2}body{background:#fff}main{max-width:none;padding:0}.card,.tile{break-inside:avoid}.pb{break-after:page}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="bar"><button id="nNew">+ Nowy zapis</button><button class="s" id="nList">Zapisy</button><button class="s" id="nAn">Analiza</button><button class="s" id="nBk">Kopia</button><button class="s" id="nLk" style="flex:0 0 44px" aria-label="Zablokuj">🔒</button></nav>
<script>
var SCH=[
["Opuszczenie / Niestabilność","Obawa, że ważne osoby odejdą, staną się niedostępne albo relacja nagle się rozpadnie."],
["Nieufność / Skrzywdzenie","Oczekiwanie, że inni wykorzystają, zranią, oszukają, upokorzą lub przekroczą granice."],
["Deprywacja emocjonalna","Przekonanie, że zabraknie troski, zrozumienia, ciepła, wsparcia lub ochrony."],
["Wadliwość / Wstyd","Poczucie bycia gorszym, niegodnym miłości lub nieakceptowalnym; obawa przed ujawnieniem słabości."],
["Izolacja społeczna / Wyobcowanie","Poczucie odmienności, niedopasowania lub pozostawania poza grupą."],
["Zależność / Niekompetencja","Przekonanie, że bez pomocy innych trudno poradzić sobie z codziennymi zadaniami lub decyzjami."],
["Podatność na zagrożenie lub chorobę","Nadmierna obawa przed katastrofą zdrowotną, emocjonalną, finansową lub inną oraz przed nieporadzeniem sobie."],
["Uwikłanie / Nierozwinięte Ja","Trudność w rozpoznaniu własnej tożsamości, potrzeb i decyzji jako odrębnych od bliskiej osoby."],
["Porażka","Przekonanie, że jest się mniej zdolnym, mniej skutecznym lub skazanym na niepowodzenie."],
["Roszczeniowość / Wielkościowość","Oczekiwanie szczególnych praw lub przywilejów; trudność w uznawaniu ograniczeń i potrzeb innych."],
["Niedostateczna samokontrola / Samodyscyplina","Trudność w tolerowaniu frustracji, odraczaniu przyjemności i wytrwaniu przy zadaniach wymagających wysiłku."],
["Podporządkowanie","Rezygnowanie z własnego zdania i oddawanie kontroli innym z obawy przed ich złością, konfliktem lub odrzuceniem."],
["Samopoświęcenie","Stawianie potrzeb innych przed własnymi kosztem odpoczynku, zdrowia lub ważnych spraw."],
["Poszukiwanie aprobaty / Uznania","Nadmierne uzależnianie poczucia własnej wartości od akceptacji, osiągnięć, statusu, wyglądu lub reakcji innych."],
["Negatywizm / Pesymizm","Skupianie uwagi na ryzyku, stratach i tym, co może się nie udać; trudność w dostrzeganiu korzystnych możliwości."],
["Zahamowanie emocjonalne","Powstrzymywanie emocji, spontaniczności lub ich wyrażania z obawy przed oceną, wstydem albo utratą kontroli."],
["Nieelastyczne standardy / Nadmierny krytycyzm","Presja spełniania bardzo wysokich wymagań; trudność w odpoczynku i przyjęciu rozwiązania wystarczająco dobrego."],
["Bezwzględna surowość / Karanie","Ostre osądzanie błędów własnych i cudzych; mało miejsca na kontekst, wyrozumiałość i naprawę."]];
var MOD=[
["Tryby dziecięce",[
["Zranione Dziecko","Smutek, lęk, samotność, wstyd lub bezradność. Potrzebuje troski i bezpieczeństwa."],
["Złoszczące się Dziecko","Złość i protest w odpowiedzi na frustrację lub niezaspokojoną potrzebę."],
["Impulsywne Dziecko","Silna chęć natychmiastowej przyjemności, ulgi lub działania; trudno wziąć pod uwagę konsekwencje."],
["Niezdyscyplinowane Dziecko","Trudność w tolerowaniu nudy, frustracji i wysiłku; chęć porzucenia zadania bez szybkiej nagrody."]]],
["Tryby krytyczne",[
["Wymagający Krytyk / Rodzic","Narzuca presję i sztywne powinności: „muszę”, „nie mogę odpuścić”, „to wciąż za mało”."],
["Karzący Krytyk / Rodzic","Zawstydza, poniża lub domaga się kary za błąd i słabość; globalnie ocenia osobę."]]],
["Zdrowe zasoby",[
["Zdrowy Dorosły","Zauważa emocje i potrzeby, sprawdza fakty, chroni granice, potrafi odpocząć i poprosić o pomoc."],
["Szczęśliwe Dziecko","Swoboda, ciekawość, zabawa, bliskość i przyjemność; poczucie, że można być sobą."]]],
["Sposoby radzenia sobie",[
["Uległy Poddany","Ustępuje i rezygnuje z własnego zdania lub granic, by uniknąć konfliktu, odrzucenia albo złości innych."],
["Samopoświęcający się Opiekun","Przejmuje odpowiedzialność za samopoczucie innych; pomaga mimo zmęczenia; odmowa budzi winę."],
["Odłączony Obrońca","Odgradza od trudnych przeżyć przez odrętwienie, dystans lub działanie na autopilocie."],
["Odłączony Samoukoiciel","Odcięcie od emocji przez zajmowanie uwagi lub przyjemne bodźce, np. telefon, ciągłe zajęcie."],
["Unikający Obrońca","Odkłada lub omija sytuacje, rozmowy i zadania wywołujące napięcie."],
["Złoszczący się Obrońca","Złością, chłodem lub nieprzystępnością buduje dystans chroniący przed zranieniem."],
["Nadmiernie Kontrolująca Część","Szuka bezpieczeństwa przez drobiazgowe planowanie, analizowanie, sprawdzanie lub perfekcję."],
["Nadmierny Kompensator","Próbuje udowodnić, że bolesne przekonania nie są prawdziwe: kontrola, perfekcjonizm, rywalizacja, dominacja."]]]];
var DEF={};SCH.forEach(function(s){DEF[s[0]]=s[1]});MOD.forEach(function(g){g[1].forEach(function(m){DEF[m[0]]=m[1]})});
var Q=[["what","1. Co się wydarzyło?","Krótkie fakty: gdzie, z kim, co zostało zrobione lub powiedziane."],
["feel","2. Co poczułem i co zauważyłem w ciele?","Nazwij emocję; własne określenie wystarczy."],
["thoughts","3. Jakie myśli lub obrazy pojawiły się w tej chwili?",""],
["react","4. Jak zareagowałem? Co zrobiłem, a czego unikałem?",""],
["now","5a. Co dało to od razu?",""],
["later","5b. Jaki skutek miało później?",""],
["need","6. Jaka potrzeba mogła być ważna w tej sytuacji?",""],
["reply","7. Co mogłoby być życzliwą i realistyczną odpowiedzią?","Słowa Zdrowego Dorosłego, granica, odpoczynek, prośba o pomoc lub mały krok."],
["own","8. Własna nazwa reakcji (opcjonalnie)",""]];
var KEY="zapisy_v1",DK="zapisy_draft_v1",E=[],cur=null,view="list",ok=true;
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){ok=false;return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){ok=false}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowIso(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fmt(t){try{return new Date(t).toLocaleString("pl-PL",{dateStyle:"medium",timeStyle:"short"})}catch(e){return t}}
function blank(){return{id:Date.now().toString(36),date:nowIso(),int:5,sch:[],mod:[],what:"",feel:"",thoughts:"",react:"",now:"",later:"",need:"",reply:"",own:""}}
var app=document.getElementById("app");
function opts(){var h='<option value="">Wybierz z listy...</option>';return h}
function schSel(){return '<select id="sSel"><option value="">+ dodaj schemat...</option>'+SCH.map(function(s){return'<option>'+esc(s[0])+'</option>'}).join("")+'</select>'}
function modSel(){return '<select id="mSel"><option value="">+ dodaj tryb / sposób radzenia sobie...</option>'+MOD.map(function(g){return'<optgroup label="'+esc(g[0])+'">'+g[1].map(function(m){return'<option>'+esc(m[0])+'</option>'}).join("")+'</optgroup>'}).join("")+'</select>'}
function chips(a,t){return a.map(function(x,i){return'<span class="chip">'+esc(x)+'<b data-t="'+t+'" data-i="'+i+'">×</b></span>'}).join("")}
function form(){
  var e=cur,h='<h1>'+(e.saved?"Edycja zapisu":"Nowy zapis")+'</h1><p class="sub">Szkic zapisuje się automatycznie. Uzupełnij tyle, ile jest pomocne.</p>';
  h+='<div class="card"><div class="f"><label>Data i godzina</label><input type="datetime-local" id="date" value="'+esc(e.date)+'">'+(e.date.slice(0,10)!==nowIso().slice(0,10)?'<p class="warn">Data inna niż dzisiejsza. Sprawdź, czy to właściwy dzień.</p>':'')+'</div>';
  Q.slice(0,2).forEach(function(q){h+=ta(q)});
  h+='<div class="f"><label>Siła emocji: <span id="iv">'+e.int+'</span>/10</label><input type="range" id="int" min="0" max="10" value="'+e.int+'"></div>';
  Q.slice(2,8).forEach(function(q){h+=ta(q)});
  h+='</div><div class="card"><label>Możliwy schemat</label><p class="h">Wybierz z listy; można dodać kilka.</p>'+schSel()+'<div class="chips" id="sCh">'+chips(e.sch,"sch")+'</div><div id="sDef"></div>';
  h+='<div style="height:14px"></div><label>Możliwy tryb</label>'+modSel()+'<div class="chips" id="mCh">'+chips(e.mod,"mod")+'</div><div id="mDef"></div>';
  h+='<div style="height:14px"></div>'+ta(Q[8])+'<p class="warn">Nazwy są pomocą w rozumieniu doświadczenia, a nie oceną osoby. Znaczenie doprecyzuj z terapeutą.</p></div>';
  h+='<div class="row"><button id="save">Zapisz</button><button class="s" id="cancel">Anuluj</button></div>';
  app.innerHTML=h;
  Q.forEach(function(q){var el=document.getElementById(q[0]);el.oninput=function(){cur[q[0]]=el.value;sv(DK,cur)}});
  document.getElementById("date").onchange=function(){cur.date=this.value;sv(DK,cur)};
  document.getElementById("int").oninput=function(){cur.int=+this.value;document.getElementById("iv").textContent=this.value;sv(DK,cur)};
  document.getElementById("sSel").onchange=function(){pick(this,"sch","sDef")};
  document.getElementById("mSel").onchange=function(){pick(this,"mod","mDef")};
  app.onclick=function(ev){var t=ev.target;if(t.dataset&&t.dataset.t){cur[t.dataset.t].splice(+t.dataset.i,1);sv(DK,cur);form()}};
  document.getElementById("save").onclick=function(){cur.saved=true;var i=E.findIndex(function(x){return x.id===cur.id});if(i>=0)E[i]=cur;else E.unshift(cur);E.sort(function(a,b){return a.date<b.date?1:-1});sv(KEY,E);try{localStorage.removeItem(DK)}catch(x){}cur=null;go("list")};
  document.getElementById("cancel").onclick=function(){var b=this;if(!b.dataset.s){b.dataset.s=1;b.textContent="Odrzucić? Dotknij ponownie";setTimeout(function(){b.dataset.s="";b.textContent="Anuluj"},4000);return}try{localStorage.removeItem(DK)}catch(x){}cur=null;go("list")};
}
function ta(q){return'<div class="f"><label for="'+q[0]+'">'+q[1]+'</label>'+(q[2]?'<p class="h">'+q[2]+'</p>':'')+'<textarea id="'+q[0]+'">'+esc(cur[q[0]])+'</textarea></div>'}
function pick(sel,t,d){var v=sel.value;if(!v)return;if(cur[t].indexOf(v)<0)cur[t].push(v);sv(DK,cur);var y=window.scrollY;form();document.getElementById(d).innerHTML='<div class="def"><b>'+esc(v)+'.</b> '+esc(DEF[v])+'</div>';window.scrollTo(0,y)}
function list(){
  var h='<h1>Zapisy</h1><p class="sub">'+E.length+' zapisów. Dane są tylko na tym urządzeniu.</p>';
  if(!ok)h+='<div class="card warn">Przeglądarka blokuje zapis lokalny. Zapisy mogą nie przetrwać zamknięcia strony.</div>';
  if(!E.length)h+='<div class="card">Brak zapisów. Dotknij „+ Nowy zapis”.</div>';
  E.forEach(function(e){h+='<div class="card e" data-id="'+e.id+'"><div class="d1">'+esc(fmt(e.date))+' · emocja '+e.int+'/10</div><p>'+esc((e.what||"(bez opisu)").slice(0,140))+'</p><div class="chips">'+e.sch.concat(e.mod).map(function(x){return'<span class="chip">'+esc(x)+'</span>'}).join("")+'</div></div>'});
  app.innerHTML=h;
  app.onclick=function(ev){var c=ev.target.closest(".e");if(c){cur=E.find(function(x){return x.id===c.dataset.id});go("detail")}};
}
function detail(){
  var e=cur,h='<h1>'+esc(fmt(e.date))+'</h1><p class="sub">Siła emocji: '+e.int+'/10</p><div class="card"><dl>';
  Q.forEach(function(q){if(e[q[0]])h+='<dt>'+esc(q[1])+'</dt><dd>'+esc(e[q[0]])+'</dd>'});
  [["Schematy",e.sch],["Tryby",e.mod]].forEach(function(p){if(p[1].length)h+='<dt>'+p[0]+'</dt><dd>'+p[1].map(function(x){return'<b>'+esc(x)+'</b>: '+esc(DEF[x])}).join("<br>")+'</dd>'});
  h+='</dl></div><div class="row"><button id="ed">Edytuj</button><button class="s" id="bk">Wróć</button><button class="d" id="dl">Usuń</button></div>';
  app.innerHTML=h;app.onclick=null;
  document.getElementById("ed").onclick=function(){cur=JSON.parse(JSON.stringify(cur));go("form")};
  document.getElementById("bk").onclick=function(){cur=null;go("list")};
  document.getElementById("dl").onclick=function(){var b=this;if(!b.dataset.s){b.dataset.s=1;b.textContent="Na pewno? Dotknij ponownie";setTimeout(function(){b.dataset.s="";b.textContent="Usuń"},4000);return}E=E.filter(function(x){return x.id!==cur.id});sv(KEY,E);cur=null;go("list")};
}
function txt(){return E.map(function(e){var s="== "+fmt(e.date)+" (emocja "+e.int+"/10) ==\n";Q.forEach(function(q){if(e[q[0]])s+=q[1]+"\n"+e[q[0]]+"\n"});if(e.sch.length)s+="Schematy: "+e.sch.join("; ")+"\n";if(e.mod.length)s+="Tryby: "+e.mod.join("; ")+"\n";return s}).join("\n")}
function bk(){
  app.innerHTML='<h1>Kopia i eksport</h1><p class="sub">Zapisy żyją tylko w tej przeglądarce. Wyczyszczenie danych strony lub zmiana telefonu je usunie, więc rób kopię regularnie.</p>'+
  '<div class="card"><label>Do wysłania terapeucie (tekst)</label><textarea id="t1" readonly style="min-height:120px">'+esc(txt())+'</textarea><div class="row" style="margin-top:8px"><button id="c1">Kopiuj tekst</button></div></div>'+
  '<div class="card"><label>Kopia zapasowa (JSON)</label><p class="h">Skopiuj i wklej np. do notatki zabezpieczonej blokadą. Aby przywrócić, wklej do pola i dotknij „Przywróć”.</p><textarea id="t2" style="min-height:100px">'+esc(JSON.stringify(E))+'</textarea><div class="row" style="margin-top:8px"><button id="c2">Kopiuj kopię</button><button class="s" id="r2">Przywróć</button></div></div>';
  app.onclick=null;
  pdfCard();function cp(id){var t=document.getElementById(id);t.select();t.setSelectionRange(0,1e7);try{document.execCommand("copy");(navigator.clipboard&&navigator.clipboard.writeText(t.value)).catch&&0}catch(e){}}
  document.getElementById("c1").onclick=function(){cp("t1")};
  document.getElementById("c2").onclick=function(){cp("t2")};
  document.getElementById("r2").onclick=function(){try{var b=document.getElementById("r2"),a=JSON.parse(document.getElementById("t2").value);if(!Array.isArray(a))throw 0;if(!b.dataset.s){b.dataset.s=1;b.textContent="Zastąpić "+E.length+" zapisów? Dotknij ponownie";setTimeout(function(){b.dataset.s="";b.textContent="Przywróć"},5000);return}E=a;sv(KEY,E);go("list")}catch(e){document.getElementById("r2").textContent="Nieprawidłowa kopia"}};
}
function draft(){var d=ld(DK,null);return d&&d.sch&&d.mod&&(d.what||d.feel||d.thoughts||d.react||d.now||d.later||d.need||d.reply||d.own||d.sch.length||d.mod.length)?d:blank()}

 document.getElementById('pr').onclick=function(){repDays=Math.max(1,Math.min(90,parseInt(document.getElementById('pd').value)||7));go('rep')};document.getElementById('pg').onclick=async function(){var b=this,o=document.getElementById('po'),n=Math.max(1,Math.min(90,parseInt(document.getElementById('pd').value)||7));o.textContent='Generuję PDF...';b.disabled=true;

var LK="zapisy_lock_v1",rendered=false,hid=0;
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function ub64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function hp(p,s){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt:ub64(s),iterations:150000,hash:"SHA-256"},k,256))}
function lcfg(){return ld(LK,null)}
var lockEl=document.createElement("div");lockEl.id="lock";document.body.appendChild(lockEl);
function unl(){lockEl.style.display="none";lockEl.innerHTML="";if(!rendered){rendered=true;go("list")}}
function showLock(){var c=lcfg();if(!c){lockEl.style.display="none";return}lockEl.style.display="flex";lockEl.innerHTML='<div class="lk"><h1>Zapisy</h1><p class="sub" style="text-align:center">Odblokuj, aby kontynuować.</p>'+(c.cred?'<button id="fid">Odblokuj Face ID</button><div style="height:10px"></div>':'')+'<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><div style="height:10px"></div><button class="s" id="pb">Odblokuj PINem</button><p class="warn" id="lm"></p></div>';var lm=function(t){document.getElementById("lm").textContent=t};if(c.cred)document.getElementById("fid").onclick=async function(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:ub64(c.cred)}],userVerification:"required",timeout:60000}});unl()}catch(e){lm("Face ID niedostępne lub anulowane. Użyj PIN.")}};document.getElementById("pb").onclick=async function(){try{if(await hp(document.getElementById("pin").value,c.salt)===c.hash)unl();else lm("Błędny PIN.")}catch(e){lm("Błąd weryfikacji.")}}}
async function regFid(){try{var r=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Zapisy"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"zapisy",displayName:"Zapisy"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});return b64(r.rawId)}catch(e){return null}}
function sec(){app.innerHTML='<h1>Blokada</h1><p class="sub">Zabezpiecz dostęp kodem PIN i Face ID.</p>';app.onclick=null;secCard()}
function secCard(){var c=lcfg(),h='<div class="card"><label>Blokada dostępu</label>';if(!c)h+='<p class="h">Ustaw PIN (4-8 cyfr). Potem możesz dodać Face ID.</p><input id="np" type="password" inputmode="numeric" placeholder="Nowy PIN"><div class="row" style="margin-top:8px"><button id="sp">Włącz blokadę</button></div>';else h+='<p class="h">Blokada włączona'+(c.cred?', Face ID aktywne':'')+'. Blokuje się po 30 s w tle.</p><input id="np" type="password" inputmode="numeric" placeholder="PIN (potrzebny do wyłączenia)"><div class="row" style="margin-top:8px"><button id="lk">Zablokuj teraz</button><button class="s" id="fb">'+(c.cred?'Usuń Face ID':'Dodaj Face ID')+'</button><button class="s" id="dp">Wyłącz blokadę</button></div>';h+='<p class="warn" id="sm">To blokada ekranu, a nie szyfrowanie danych.</p></div>';app.insertAdjacentHTML('beforeend',h);var $=function(i){return document.getElementById(i)},m=function(t){$('sm').textContent=t};if(!c)$('sp').onclick=async function(){var p=$('np').value;if(!/^\d{4,8}$/.test(p))return m('PIN: 4-8 cyfr.');try{var s=b64(crypto.getRandomValues(new Uint8Array(16)));sv(LK,{salt:s,hash:await hp(p,s)});go('sec')}catch(e){m('Blokada nie działa w tej przeglądarce.')}};else{$('fb').onclick=async function(){if(c.cred){c.cred=null;sv(LK,c);return go('sec')}var id=await regFid();if(id){c.cred=id;sv(LK,c);go('sec')}else m('Face ID nie zadziałało w tym środowisku. Zostaje PIN.')};$('lk').onclick=showLock;$('dp').onclick=async function(){try{if(await hp($('np').value,c.salt)===c.hash){try{localStorage.removeItem(LK)}catch(e){}go('sec')}else m('Podaj poprawny PIN.')}catch(e){m('Błąd weryfikacji.')}}}}
